<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SitPred · Situation Predictor</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a situation room. Left rail of live situations, a main board that reads top-down in SitPred's five parts, instruments (sliders, signals) beside the outcome they move. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --sunk:#F5F7F8; --ink:#101A22; --muted:#56636E; --faint:#8794A0; --line:#D8DEE3; --line-strong:#B9C2CA;
  --accent:#0B6E69; --accent-soft:rgba(11,110,105,.10);
  --p0:#0B6E69; --p1:#6E4BC8; --p2:#B86E0E;
  --good:#2F7D4F; --warn:#B5770A; --bad:#B4402A; --bad-soft:rgba(180,64,42,.10);
  --f-display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1216; --surface:#131B21; --sunk:#0F171C; --ink:#E4EBF0; --muted:#97A5B0; --faint:#6B7984; --line:#24313A; --line-strong:#34434E;
  --accent:#36B9AD; --accent-soft:rgba(54,185,173,.14); --p0:#36B9AD; --p1:#A88BF2; --p2:#E3A247;
  --good:#5DBB82; --warn:#E0A63A; --bad:#EE7A60; --bad-soft:rgba(238,122,96,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1216; --surface:#131B21; --sunk:#0F171C; --ink:#E4EBF0; --muted:#97A5B0; --faint:#6B7984; --line:#24313A; --line-strong:#34434E;
  --accent:#36B9AD; --accent-soft:rgba(54,185,173,.14); --p0:#36B9AD; --p1:#A88BF2; --p2:#E3A247;
  --good:#5DBB82; --warn:#E0A63A; --bad:#EE7A60; --bad-soft:rgba(238,122,96,.14); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand .ed{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;letter-spacing:.04em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:7px;font-weight:500}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.top .spacer{flex:1}
.top .ver{font-family:var(--f-mono);font-size:11px;color:var(--faint)}

.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1440px;margin:0 auto}

/* app frame uses container queries so the board can render phone frames */
.app{container-type:inline-size}
.room{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}
@container (max-width: 900px){.room{grid-template-columns:1fr}.rail{order:2}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 0}
.ph h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em}
.ph .step{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-right:8px}
.ph .aside{font-size:12px;color:var(--muted)}
.pb{padding:12px 16px 16px}

/* rail */
.rail{display:flex;flex-direction:column;gap:12px}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:4px 4px 0;font-weight:600}
.sit{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;color:var(--ink)}
.sit:hover{border-color:var(--line-strong)}
.sit[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.sit .k{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sit .t{font-weight:600;margin:4px 0 8px;line-height:1.3}
.sit .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.dot.live{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.dot.live{animation:none}}
.newbtn{border:1px dashed var(--line-strong);background:transparent;border-radius:var(--r);padding:11px;color:var(--muted);font-weight:500}
.newbtn:hover{color:var(--ink);border-color:var(--accent)}
.track{padding:12px}
.track .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.track small{color:var(--muted);font-size:12px}
.tag-ex{font-size:10.5px;font-family:var(--f-mono);color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 5px;white-space:nowrap}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.acc{color:var(--accent);border-color:var(--accent)}
.head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.2cqi,32px);letter-spacing:-.015em;line-height:1.12;margin:0;max-width:30ch;text-wrap:balance}
.head .live{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:8px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:500;text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:16px}
.strip>div{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.strip .v{font-family:var(--f-display);font-size:20px;font-weight:700;margin-top:4px;line-height:1.15}
.strip .s{font-size:12px;color:var(--muted);margin-top:2px}
.meter{height:5px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.risk i{background:var(--bad)}
@container (max-width: 700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--line)}}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@container (max-width: 1080px){.g3{grid-template-columns:1fr}}
@container (max-width: 900px){.g2{grid-template-columns:1fr}}

.situ{font-size:14.5px;line-height:1.55;max-width:72ch;margin:0}
.situ b{font-weight:600}

/* players */
.player{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);min-width:0}
.player .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.player .role{font-size:12px;color:var(--muted);margin:2px 0 10px}
.acts{display:flex;flex-direction:column;gap:7px}
.act{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.act .bar{position:relative;height:22px;border-radius:5px;background:var(--sunk);overflow:hidden}
.act .bar i{position:absolute;inset:0 auto 0 0;opacity:.22}
.act .bar span{position:absolute;left:8px;top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 12px)}
.act.lead .bar span{font-weight:600}
.act.lead .bar i{opacity:.4}
.act .p{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.fixed{font-size:11px;font-family:var(--f-mono);color:var(--accent);margin-left:auto}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.trait{font-size:11px;border-radius:5px;padding:2px 7px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.trait.src{border-style:solid}
.trait.asm{border-style:dashed}
.trait b{color:var(--ink);font-weight:600}

/* outcomes */
.outs{display:flex;flex-direction:column;gap:14px}
.out .orow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.out .name{font-weight:600}
.out .pc{font-family:var(--f-mono);font-size:18px;font-weight:500}
.out .desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.range{position:relative;height:12px;margin-top:8px;background:var(--sunk);border-radius:6px;border:1px solid var(--line)}
.range .fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:var(--ink);opacity:.75}
.range .band{position:absolute;top:-4px;bottom:-4px;border-left:1.5px solid var(--faint);border-right:1.5px solid var(--faint)}
.out.war .fill{background:var(--bad);opacity:.85}
.out.best .fill{background:var(--accent);opacity:1}
.legend{font-size:11.5px;color:var(--faint);margin-top:12px}

/* recommendation */
.rec{border:1.5px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
.rec .call{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:2px 0 8px}
.rec p{margin:0 0 12px;max-width:62ch}
.eu{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.eu .r{display:grid;grid-template-columns:118px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:12.5px}
.eu .r .b{height:10px;border-radius:5px;background:var(--line)}
.eu .r .b i{display:block;height:100%;border-radius:5px;background:var(--faint)}
.eu .r.best .b i{background:var(--accent)}
.eu .r.best{font-weight:600}
.eu .r .n{font-family:var(--f-mono);text-align:right}
.why{margin:0;padding-left:18px;font-size:13px}
.why li{margin:3px 0}

/* sensitivity */
.sl{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sl:first-child{border-top:0;padding-top:0}
.sl label{font-weight:500;font-size:13px}
.sl .val{font-family:var(--f-mono);text-align:right;font-size:13px}
.sl input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent)}
.sl .hint{grid-column:1 / -1;font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.flip{grid-column:1 / -1;font-size:12px;border-radius:6px;padding:6px 9px;background:var(--sunk);border:1px solid var(--line)}
.flip.hot{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}

/* signals */
.sig{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0;padding-top:0}
.sig .when{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);padding-top:2px}
.sig .what{font-weight:500}
.sig .src{font-size:11.5px;color:var(--muted);margin-top:2px}
.sig .eff{font-size:12px;margin-top:4px;font-family:var(--f-mono)}
.sig.done .what{color:var(--muted)}
.applied{font-size:11.5px;color:var(--good);font-weight:600;white-space:nowrap}
.up{color:var(--bad)} .down{color:var(--good)}

.long p{margin:0 0 10px;max-width:72ch}
.long .pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);border:1px solid var(--line);margin-right:6px}

/* tree */
.tree svg{width:100%;max-width:680px;height:auto;display:block;margin:0 auto}
.tree text{fill:var(--ink);font-family:var(--f-body)}
.tree .q{fill:var(--muted)}
.tree .m{font-family:var(--f-mono)}

/* setup */
.setup{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@container (max-width: 860px){.setup{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--muted)}
.steps li b{font-family:var(--f-mono);font-size:11px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;flex:none;font-weight:500}
.steps li.on{color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.steps li.ok b{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.book{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.book:hover{border-color:var(--line-strong)}
.book[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.book[disabled]{opacity:.55;cursor:not-allowed}
.book .bt{font-weight:600}
.book .bd{font-size:12.5px;color:var(--muted)}
.book .bm{font-size:11px;font-family:var(--f-mono);color:var(--faint);margin-top:auto}
.h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px}
textarea{width:100%;min-height:96px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.5}
.v01{font-size:12px;color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.pcard h4{margin:0 0 2px;display:flex;align-items:center;gap:8px;font-size:14px}
.pcard .g{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
.field span:last-child{font-family:var(--f-mono)}
.field small{grid-column:1/-1;font-size:11px;color:var(--faint)}
.field small.srcok{color:var(--good)} .field small.srcasm{color:var(--warn)}
.srcok{color:var(--good)} .srcasm{color:var(--warn)}
.footbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

/* memo */
.memo{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(20px,5cqi,48px)}
.memo .mh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.memo h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.memo h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.memo p,.memo li{max-width:68ch}
.memo table{border-collapse:collapse;width:100%;font-size:13px}
.memo td,.memo th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.memo th{font-size:11.5px;color:var(--muted);font-weight:600}
.memo td.num{text-align:right}
.tbl{overflow-x:auto}
.memo .callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 6px 6px 0;font-weight:500}
.memo .sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:20px}
.memo .sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:50}

/* screens board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:28px}
.board.phones{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.shot figcaption{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.shot figcaption b{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.shot figcaption span{font-weight:600}
.shot figcaption em{font-style:normal;color:var(--muted);font-size:12.5px}
.shot figure{margin:0}
.frame{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
.frame .inner{transform-origin:0 0;pointer-events:none;background:var(--bg)}
.frame .inner .view{padding-block:20px}
.phone{border-radius:28px;border:6px solid var(--ink)}
.boardhead{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.boardhead h1{font-family:var(--f-display);font-size:30px;margin:0;letter-spacing:-.015em}
.boardhead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.sec-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:34px 0 14px}
/* analyze your own */
.an-form{max-width:980px}
.an-h{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.015em;line-height:1.15;margin:6px 0 6px;text-wrap:balance}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.ichips{display:flex;flex-wrap:wrap;gap:6px}
.ichip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink)}
.ichip:hover{border-color:var(--accent)}
.ichip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.an-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.sel select{width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:9px 10px}
.exms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.exm{text-align:left;border:1px dashed var(--line-strong);background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.exm:hover{border-color:var(--accent);border-style:solid}
.exm b{font-size:13px}.exm span{font-size:12px;color:var(--muted)}

<script>
/* ============ ENGINE ============ */
function profiles(n){let o=[[]];for(const k of n){const x=[];for(const p of o)for(let a=0;a<k;a++)x.push([...p,a]);o=x;}return o;}
function softmax(u,lam){const m=Math.max(...u);const e=u.map(v=>Math.exp(lam*(v-m)));const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s);}
function solveSim(G,x,fixed,lamOverride){
  const lam=lamOverride??x.lambda, P=G.players.length, nA=G.players.map(p=>p.acts.length), prof=profiles(nA);
  const pay=prof.map(p=>G.payoff(p,x));
  const lo=[],hi=[];for(let i=0;i<P;i++){const v=pay.map(r=>r[i]);lo[i]=Math.min(...v);hi[i]=Math.max(...v);}
  const norm=pay.map(r=>r.map((v,i)=>(v-lo[i])/((hi[i]-lo[i])||1)));
  const fx=i=>fixed[i]!=null;
  let sig=nA.map((n,i)=>fx(i)?Array.from({length:n},(_,a)=>a===fixed[i]?1:0):Array(n).fill(1/n));
  for(let it=0;it<300;it++){
    const EU=nA.map(n=>Array(n).fill(0));
    prof.forEach((p,k)=>{for(let i=0;i<P;i++){let w=1;for(let j=0;j<P;j++)if(j!==i)w*=sig[j][p[j]];EU[i][p[i]]+=w*norm[k][i];}});
    const ns=EU.map((u,i)=>fx(i)?sig[i]:softmax(u,lam));
    sig=sig.map((s,i)=>s.map((v,a)=>.5*v+.5*ns[i][a]));
  }
  const EUraw=nA.map(n=>Array(n).fill(0));
  prof.forEach((p,k)=>{for(let i=0;i<P;i++){let w=1;for(let j=0;j<P;j++)if(j!==i)w*=sig[j][p[j]];EUraw[i][p[i]]+=w*pay[k][i];}});
  const joint=prof.map(p=>p.reduce((w,a,i)=>w*sig[i][a],1));
  const idx=q=>prof.findIndex(r=>r.every((v,j)=>v===q[j]));
  const nash=prof.filter((p,k)=>p.every((a,i)=>{for(let b=0;b<nA[i];b++){if(b===a)continue;const q=[...p];q[i]=b;if(pay[idx(q)][i]>pay[k][i]+1e-9)return false;}return true;}));
  return {sig,EU:EUraw,joint,prof,nash};
}
function solveSeq(G,x,fixed,lamOverride){
  // player 0 leads, player 1 follows with logit response
  const lam=lamOverride??x.lambda, n0=G.players[0].acts.length, n1=G.players[1].acts.length;
  const all=[];for(let a=0;a<n0;a++)for(let b=0;b<n1;b++)all.push(G.payoff([a,b],x));
  const lo=[0,1].map(i=>Math.min(...all.map(v=>v[i]))),hi=[0,1].map(i=>Math.max(...all.map(v=>v[i])));
  const nm=(v,i)=>(v-lo[i])/((hi[i]-lo[i])||1);
  const resp=[];for(let a=0;a<n0;a++){resp.push(fixed[1]!=null?Array.from({length:n1},(_,b)=>b===fixed[1]?1:0):softmax(Array.from({length:n1},(_,b)=>nm(G.payoff([a,b],x)[1],1)),lam));}
  const EUn=Array.from({length:n0},(_,a)=>resp[a].reduce((s,q,b)=>s+q*nm(G.payoff([a,b],x)[0],0),0));
  const EU0=Array.from({length:n0},(_,a)=>resp[a].reduce((s,q,b)=>s+q*G.payoff([a,b],x)[0],0));
  const lead=fixed[0]!=null?Array.from({length:n0},(_,a)=>a===fixed[0]?1:0):softmax(EUn,lam);
  const follow=Array.from({length:n1},(_,b)=>lead.reduce((s,p,a)=>s+p*resp[a][b],0));
  const prof=profiles([n0,n1]);const joint=prof.map(([a,b])=>lead[a]*resp[a][b]);
  // subgame perfect (pure): follower best reply to each leader move
  const br=Array.from({length:n0},(_,a)=>{let bb=0;for(let b=1;b<n1;b++)if(G.payoff([a,b],x)[1]>G.payoff([a,bb],x)[1])bb=b;return bb;});
  let la=0;for(let a=1;a<n0;a++)if(G.payoff([a,br[a]],x)[0]>G.payoff([la,br[la]],x)[0])la=a;
  return {sig:[lead,follow],EU:[EU0],joint,prof,nash:[[la,br[la]]],resp,seq:true};
}
function solve(G,x,fixed,lam){return G.seq?solveSeq(G,x,fixed,lam):solveSim(G,x,fixed,lam);}
function outcomeProbs(G,r){const out=G.outcomes.map(()=>0);r.prof.forEach((p,k)=>{out[G.classify(p)]+=r.joint[k];});return out;}

/* ============ GAMES ============ */
const pct=v=>`${(v*100).toFixed(0)}%`;
const rate=v=>`${v.toFixed(2)}%`;
const GAMES={
deposit:{
  id:'deposit', playbook:'Deposit rate war', type:'Simultaneous', rounds:'Repeated every FOMC meeting', seq:false,
  title:'The Fed cut 25 bps. What do we do with our 4.10% savings rate?',

  scenario:'The Fed cut its target range by 25 bps on Wednesday. Our high-yield savings pays 4.10%. Ledgerly, a VC-backed savings app, pays 4.40% and is chasing growth. Summit National pays 3.75% and has a large branch base. ALCO meets Friday to set our rate for the next six weeks.',
  players:[
    {name:'Northwind Bank',tag:'Us',role:'Regional bank, $40B assets · 4.10% APY',color:'--p0',
     acts:['Hold at 4.10%','Pass through 25 bps','Cut 50 bps'],
     traits:[['Funding need','phiN','asm'],['Loan-to-deposit','92%','src'],['Brand pull','Medium','asm']]},
    {name:'Ledgerly',tag:'Fintech',role:'Savings app, VC funded · 4.40% APY',color:'--p1',
     acts:['Hold at 4.40%','Pass through 25 bps','Cut 50 bps'],
     traits:[['Funding need','phiL','asm'],['Last 3 cuts','Lagged 2 of 3','src'],['Brand pull','Low','asm']]},
    {name:'Summit National',tag:'Big bank',role:'National bank, branch heavy · 3.75% APY',color:'--p2',
     acts:['Hold at 3.75%','Pass through 25 bps','Cut 50 bps'],
     traits:[['Funding need','Low','asm'],['Last 3 cuts','Passed 3 of 3','src'],['Brand pull','High','asm']]}
  ],
  params:[
    {k:'beta',label:'How hard savers chase rate',min:.5,max:3,step:.05,v:1.6,fmt:v=>v.toFixed(2),hint:'Share shift per 1 pt of rate gap',src:'asm'},
    {k:'phiL',label:"Ledgerly's need for new deposits",min:0,max:2,step:.05,v:.8,fmt:v=>v.toFixed(2),hint:'Value of a deposit beyond its margin, % pts',src:'asm'},
    {k:'phiN',label:'Our need for new deposits',min:0,max:1.5,step:.05,v:.2,fmt:v=>v.toFixed(2),hint:'From the loan pipeline, % pts',src:'asm'},
    {k:'lambda',label:'How rationally rivals act',min:2,max:20,step:.5,v:8,fmt:v=>v.toFixed(1),hint:'Higher means fewer mistakes',src:'asm'}
  ],
  base:{y:4.40,phiS:.05},
  payoff(p,x){const base=[4.10,4.40,3.75],a=[0,-.35,.55],phi=[x.phiN,x.phiL,x.phiS],cut=[0,.25,.5];
    const r=p.map((c,i)=>base[i]-cut[c]);const e=r.map((ri,i)=>Math.exp(x.beta*ri+a[i]));
    const S=e.reduce((s,v)=>s+v,0)+Math.exp(x.beta*3.9+.3);return r.map((ri,i)=>e[i]/S*(x.y-ri+phi[i]));},
  outcomes:[
    {name:'Orderly pass-through',desc:'Everyone lowers rates. Margins hold, few deposits move.'},
    {name:'One holdout grabs flows',desc:'A single player keeps its rate and pulls rate-sensitive savers.'},
    {name:'Deposit war',desc:'Two or more hold. Funding costs stay high for the whole market.',war:true}
  ],
  classify(p){const h=p.filter(c=>c===0).length;return h===0?0:h===1?1:2;},
  conflictLabel:'Conflict risk',
  conflict(o){return o[2]+.5*o[1];},
  signals:[
    {id:'s1',when:'Wed 14:00',what:'FOMC cuts the target range by 25 bps',src:'Federal Reserve statement',auto:true},
    {id:'s2',when:'Thu 09:12',what:'Summit National posts 3.50% on its savings page',src:'Rate table scrape · sourced',fix:[2,1]},
    {id:'s3',when:'Thu 11:40',what:'Ledgerly announces a $180M Series C',src:'Press release · sourced',set:{phiL:1.4}},
    {id:'s4',when:'Thu 16:05',what:'Ledgerly app banner: "Your 4.40% is locked through spring"',src:'App screenshot · sourced',fix:[1,0]}
  ],
  situation(x,r){return `The Fed's 25 bps cut lowers what we earn on new assets to about <b>${rate(x.y)}</b>. Our 4.10% savings rate now sits between Ledgerly at 4.40% and Summit National at 3.75%. Each player must choose to hold, pass the cut through, or cut deeper, and each one's best choice depends on the other two.`;},
  why(x,r,rec){const L=r.sig[1],S=r.sig[2];const out=[];
    out.push(`Ledgerly holds with ${pct(L[0])} odds: its need for deposits (${x.phiL.toFixed(2)}) outweighs the margin it gives up.`);
    out.push(`Summit National passes the cut through with ${pct(S[1]+S[2])} odds: its brand keeps savers without a rate premium.`);
    out.push(rec===0?`Savers chase rate hard (${x.beta.toFixed(2)}), so holding protects our deposit base.`:rec===1?`Passing 25 bps keeps us ${(4.10-0.25-3.50).toFixed(2)} pts above Summit's likely rate while restoring margin.`:`A 50 bps cut maximises margin, and we rarely lose deposits to rivals who also cut.`);
    return out;},
  longterm(o,r){return [`If this pattern repeats over the next three FOMC meetings, the market most likely settles into <b>${this.outcomes[o.indexOf(Math.max(...o))].name.toLowerCase()}</b>. Ledgerly is the player most likely to break any truce, because its funding need resets with each raise.`,
    `Watch for Ledgerly's next funding round and Summit National's quarterly deposit data. Either one moves the odds more than any single rate change.`];}
},
cards:{
  id:'cards', playbook:'Card fee war', type:'Sequential · we move first', rounds:'Repeated yearly', seq:true,
  title:'Should we refresh the Northwind Reserve card before Atlas does?',
  short:'Premium card refresh: move before Atlas?',
  scenario:'Our premium card, Northwind Reserve, charges $550 a year with about $1,500 in stated perks. Atlas Platinum charges $695 with about $2,000. Rumours say Atlas plans a refresh. Do we move first, and how big?',
  players:[
    {name:'Northwind Reserve',tag:'Us · leader',role:'Premium card · $550 fee',color:'--p0',
     acts:['Hold at $550','Refresh: $695 + $2,400 perks','Leap: $795 + $3,000 perks'],
     traits:[['Cards in force','1.1M','src'],['Perk cost','cost','asm']]},
    {name:'Atlas Platinum',tag:'Rival · follower',role:'Premium card · $695 fee',color:'--p1',
     acts:['Hold at $695','Refresh: $795 + $2,800 perks','Leap: $895 + $3,500 perks'],
     traits:[['Brand premium','$60 a year','asm'],['Answered last rival move in','1 day','src']]}
  ],
  params:[
    {k:'usage',label:'How much of the stated perks cardholders really use',min:.25,max:.7,step:.01,v:.45,fmt:v=>pct(v),hint:'Share of stated value felt by the customer',src:'asm'},
    {k:'cost',label:'Our cost per $1 of stated perks',min:.15,max:.5,step:.01,v:.32,fmt:v=>`$${v.toFixed(2)}`,hint:'After breakage and partner funding',src:'asm'},
    {k:'lambda',label:'How rationally Atlas acts',min:2,max:20,step:.5,v:8,fmt:v=>v.toFixed(1),hint:'Higher means fewer mistakes',src:'asm'}
  ],
  base:{brand:60},
  payoff(p,x){const US=[[550,1500],[695,2400],[795,3000]],AT=[[695,2000],[795,2800],[895,3500]];
    const o=[US[p[0]],AT[p[1]]];const v=o.map(([f,s],i)=>x.usage*s-f+(i===1?x.brand:0));
    const e=v.map(q=>Math.exp(q/150));const S=e.reduce((a,b)=>a+b,0)+1;return o.map(([f,s],i)=>e[i]/S*(f-x.cost*s+450));},
  outcomes:[
    {name:'Quiet market',desc:'Neither card changes. Fees and perks stay put for another year.'},
    {name:'One-sided refresh',desc:'One card upgrades and wins affluent spenders from the other.'},
    {name:'Perks arms race',desc:'Both cards raise fees and perks. Costs climb on both sides.',war:true}
  ],
  classify(p){const n=p.filter(c=>c>0).length;return n;},
  conflictLabel:'Conflict risk',
  conflict(o){return o[2]+.3*o[1];},
  signals:[
    {id:'c1',when:'Mon',what:'Atlas teases its "largest card investment ever" on social media',src:'Atlas social posts · sourced',set:{brand:110}},
    {id:'c2',when:'Tue',what:'Partner lounge network raises its per-visit price 20%',src:'Partner notice · sourced',set:{cost:.38}},
    {id:'c3',when:'Thu',what:'Atlas files a new fee schedule: $895',src:'Card agreement filing · sourced',fix:[1,2]}
  ],
  situation(x){return `Atlas Platinum leads on stated perks, and a refresh looks close. If we move first, Atlas answers knowing our move, so the question is how each of our options changes Atlas's best reply. Cardholders use about <b>${pct(x.usage)}</b> of stated perk value, and each $1 of stated perks costs us <b>$${x.cost.toFixed(2)}</b>.`;},
  why(x,r,rec){const R=r.resp;const out=[];
    out.push(`If we hold, Atlas refreshes or leaps with ${pct(R[0][1]+R[0][2])} odds and takes our affluent spenders.`);
    out.push(`If we refresh to $695, Atlas's best reply shifts: it leaps with ${pct(R[1][2])} odds.`);
    out.push(rec===2?`Leaping first leaves Atlas little room, because its $895 tier then costs more than cardholders value.`:rec===1?`A mid-size refresh keeps our perk costs under control at $${x.cost.toFixed(2)} per $1.`:`At $${x.cost.toFixed(2)} per $1 of perks, upgrades cost more than the fees they bring in.`);
    return out;},
  longterm(o){return [`Premium cards repeat this game every year, and the 2025 Chase and Amex fee moves show rivals answer within days. The most likely path is <b>${this.outcomes[o.indexOf(Math.max(...o))].name.toLowerCase()}</b>.`,`A fee war is won on perk cost, not fee level. Partner-funded perks lower our cost per $1 and widen the set of moves that pay.`];}
},
fraud:{
  id:'fraud', playbook:'Scam arms race', type:'Simultaneous · attacker and defender', rounds:'Continuous', seq:false,
  title:'Scam ring targeting our customers: which payee controls do we turn on?',
  short:'Scam ring: which payee controls to turn on',
  scenario:'A scam ring is running fake investment ads that lead our customers to send bank transfers to new payees. We can keep light checks, add smart friction (warnings and short delays on risky new payees), or hold every new payee for 24 hours. The ring can keep going, switch to card fraud, or move to another bank.',
  players:[
    {name:'Northwind fraud team',tag:'Us · defender',role:'Payments controls',color:'--p0',
     acts:['Light checks','Smart friction','24-hour holds'],
     traits:[['Reimbursement share','reimb','src'],['Friction cost','fric','asm']]},
    {name:'Scam ring',tag:'Attacker',role:'Investment scam ads → bank transfers',color:'--p2',
     acts:['Keep targeting our customers','Switch to card fraud','Move to another bank'],
     traits:[['Channel','Social ads','src'],['Switch speed','Weeks','asm']]}
  ],
  params:[
    {k:'reimb',label:'Share of scam losses we reimburse',min:.2,max:1,step:.01,v:.61,fmt:v=>pct(v),hint:'UK banks refunded 61% of APP losses in 2025 (UK Finance)',src:'src'},
    {k:'fric',label:'Cost of friction to good customers',min:.2,max:2,step:.05,v:1,fmt:v=>`${v.toFixed(2)}×`,hint:'Abandoned payments and complaints',src:'asm'},
    {k:'other',label:'How easy other banks are to target',min:.2,max:.9,step:.01,v:.55,fmt:v=>v.toFixed(2),hint:'Ring\'s take elsewhere, £m a month',src:'asm'},
    {k:'lambda',label:'How fast the ring adapts',min:2,max:20,step:.5,v:8,fmt:v=>v.toFixed(1),hint:'Higher means it finds the weak spot faster',src:'asm'}
  ],
  base:{},
  payoff(p,x){const LOSS=[1,.45,.2],FR=[0,.15,.6];const [b,s]=p;const loss=s===0?LOSS[b]:s===1?.5:.05;
    const bank=-(loss*x.reimb)-(s===0?.3*loss:0)-FR[b]*x.fric;const take=s===0?LOSS[b]:s===1?.35:x.other;return [bank,take];},
  outcomes:[
    {name:'Bank transfer losses continue',desc:'The ring keeps targeting our customers through investment ads.',war:true},
    {name:'Losses shift to cards',desc:'The ring moves to card-not-present fraud, where other controls apply.'},
    {name:'Ring moves to another bank',desc:'Our customers are no longer the easiest target.'}
  ],
  classify(p){return p[1];},
  conflictLabel:'Residual loss risk',

  signals:[
    {id:'f1',when:'Day 1',what:'Spike in first-time payees linked to one crypto exchange',src:'Payments data · sourced'},
    {id:'f2',when:'Day 3',what:'Peer bank adds 24-hour holds on new payees',src:'Industry fraud forum · sourced',set:{other:.35}},
    {id:'f3',when:'Day 6',what:'Complaints about delayed payments double',src:'Complaints data · sourced',set:{fric:1.5}}
  ],
  situation(x){return `The ring's investment ads push our customers to pay new payees by bank transfer, the costliest scam channel. Under UK rules we reimburse about <b>${pct(x.reimb)}</b> of these losses. Every control we add also slows good customers, and the ring will move to whatever we leave open.`;},

    out.push(rec===2?`Losses are expensive enough that full holds pay for their friction.`:rec===1?`Smart friction stops most of the loss at a fraction of the friction of full holds.`:`Friction costs more than the losses it prevents at these settings.`);

}
};

/* ============ STATE ============ */
const S={game:'deposit',params:{},applied:{},fixed:{},log:{},setupBook:'deposit',route:'room'};
function initGame(id){const G=GAMES[id];S.params[id]=Object.assign({},G.base,Object.fromEntries(G.params.map(p=>[p.k,p.v])));S.applied[id]=new Set(G.signals.filter(s=>s.auto).map(s=>s.id));S.fixed[id]={};S.log[id]=[];}
Object.keys(GAMES).forEach(initGame);

function compute(id,overrides){
  const G=GAMES[id],x=overrides?.params||S.params[id],fixed=overrides?.fixed||S.fixed[id];
  const r=solve(G,x,fixed);const o=outcomeProbs(G,r);
  const lo=outcomeProbs(G,solve(G,x,fixed,x.lambda*.5)),hi=outcomeProbs(G,solve(G,x,fixed,x.lambda*1.8));
  const band=o.map((v,i)=>[Math.min(v,lo[i],hi[i]),Math.max(v,lo[i],hi[i])]);
  const eu=r.EU[0];let rec=0;eu.forEach((v,i)=>{if(v>eu[rec])rec=i;});
  const H=-r.joint.reduce((s,p)=>s+(p>0?p*Math.log(p):0),0),Hmax=Math.log(r.joint.length);
  const stability=1-H/Hmax;
  return {G,x,r,o,band,rec,eu,stability,conflict:G.conflict(o)};
}
function eqLabel(c){const r=c.r;if(r.seq)return {v:'Stackelberg',s:`Perfect play: ${c.G.players[0].acts[r.nash[0][0]].split(':')[0]} → ${c.G.players[1].acts[r.nash[0][1]].split(':')[0]}`};
  if(r.nash.length===1)return {v:'Unique pure Nash',s:'Stable point: '+r.nash[0].map((a,i)=>c.G.players[i].acts[a].split(' ')[0]).join(' · ')};
  if(r.nash.length>1)return {v:`${r.nash.length} pure equilibria`,s:'Coordination problem: outcome depends on who moves first'};
  return {v:'Mixed only',s:'No stable point: players keep second-guessing'};}
function stabLabel(s){return s>.45?'High':s>.25?'Medium':'Low';}

/* flip points: scan each param for where our recommendation changes */
function flipPoint(id,p){
  const G=GAMES[id],x=S.params[id],base=compute(id).rec;const N=60;const res=[];
  for(let i=0;i<=N;i++){const v=p.min+(p.max-p.min)*i/N;const xx=Object.assign({},x,{[p.k]:v});const r=solve(G,xx,S.fixed[id]);const eu=r.EU[0];let rc=0;eu.forEach((q,j)=>{if(q>eu[rc])rc=j;});res.push([v,rc]);}
  const cur=x[p.k];let best=null;
  for(let i=1;i<res.length;i++){if(res[i][1]!==res[i-1][1]){const v=(res[i][0]+res[i-1][0])/2;const to=v>cur?res[i][1]:res[i-1][1];if(to===base)continue;const d=Math.abs(v-cur);if(!best||d<best.d)best={v,d,to,dir:v>cur?'rises above':'falls below'};}}
  return best;
}

/* ============ RENDER ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function traitVal(G,t,x){const v=t[1];if(x[v]!==undefined){const p=G.params.find(q=>q.k===v);return p?p.fmt(x[v]):v;}return v;}

function rail(cur){
  const items=Object.values(GAMES).map(G=>{const c=compute(G.id);const top=c.o.indexOf(Math.max(...c.o));
    return `<button class="sit" data-act="game" data-id="${G.id}" aria-current="${G.id===cur}">

    [-28,0,28].forEach((dy,b)=>{s+=`<path d="M${mx+120} ${y}C${fx-60} ${y},${fx-70} ${y+dy},${fx-8} ${y+dy}" fill="none" stroke="var(--p1)" stroke-width="${.8+r.resp[a][b]*5}" stroke-opacity=".7"/>`;
      s+=`<text x="${fx}" y="${y+dy+4}" font-size="11">${esc(G.players[1].acts[b].split(':')[0])} <tspan class="m q">${pct(r.resp[a][b])}</tspan></text>`;});

function withState(id,params,sigs,fn,scrollSignals){
  const save={game:S.game,p:S.params[id],a:S.applied[id],f:S.fixed[id],l:S.log[id]};
  initGame(id);S.game=id;Object.assign(S.params[id],params);sigs.forEach(s=>applySignal(id,s));

function applySignal(id,sid){
  const G=GAMES[id],s=G.signals.find(q=>q.id===sid);if(!s||S.applied[id].has(sid))return;
  const before=compute(id).o;
  if(s.set)Object.assign(S.params[id],s.set);
  if(s.fix)S.fixed[id][s.fix[0]]=s.fix[1];
  S.applied[id].add(sid);
  const after=compute(id).o;const k=G.outcomes.findIndex(o=>o.war);
  S.log[id].push({id:sid,k,before:before[k],after:after[k]});
}

/* ---- in-browser game model ---- */
const NAME_STOP=new Set(('The A An And Or But If When While Each Both All Our We Their They It Its This That These Those In On At Of For To From With By As Is Are Be Must Should Can Could Will Would Two Three Four Five Six One Who What Which Do Does Did Has Have Had New Just Being Example Being Ahead Being First Fed AI SaaS VC CEO CFO US UK EU Q1 Q2 Q3 Q4 APY SKUs SKU Monday Tuesday Wednesday Thursday Friday Saturday Sunday January February March April May June July August September October November December Toronto Ontario Canada Canadian Vancouver Montreal America American British London New York Holiday Black Friday Christmas Each Every Some Most Many After Before During Since Until Then Now Today Tomorrow Yesterday Year Years Week Weeks Month Months Being Rough Buggy Example Players Player').split(' '));
function findNames(t){
  const out=[];const re=/\b[A-Z][A-Za-z0-9&'’.\-]*(?:\s+(?:[A-Z][A-Za-z0-9&'’.\-]*|of|&))*\b/g;let m;
  while((m=re.exec(t))){let w=m[0].replace(/[.’']+$/,'');const parts=w.split(/\s+/).filter(p=>!NAME_STOP.has(p.replace(/[.,]/g,'')));
    w=parts.join(' ').replace(/\s+(of|&)$/,'').trim();if(!w||w.length<3||NAME_STOP.has(w)||/^[A-Z]{2,}-|-(backed|based|funded)$/i.test(w))continue;
    if(!out.some(o=>o.toLowerCase()===w.toLowerCase()||o.startsWith(w+' ')||w.startsWith(o+' ')))out.push(w);}
  return out;
}
function movesFor(t){
  const s=t.toLowerCase();
  if(/\blaunch|\brelease|\bship\b|\bfeature|first to market|first-to-market/.test(s))return['Launch now','Fast follow','Wait and polish'];
  if(/savings rate|deposit|apy|interest rate|bps/.test(s))return['Hold or raise the rate','Pass the cut through','Cut deeper'];
  if(/price|pric|fare|fee|discount|undercut|cheaper|cost/.test(s))return['Undercut further','Match the move','Hold and differentiate'];
  if(/hire|hiring|talent|caregiver|wage|salar|recruit/.test(s))return['Outbid on pay','Match offers','Compete on quality'];
  if(/enter|entrant|entry|expan/.test(s))return['Fight hard','Accommodate','Differentiate'];
  if(/bid|acqui|merger|takeover|auction/.test(s))return['Bid aggressively','Bid at fair value','Walk away'];
  return['Compete aggressively','Match rivals','Hold position'];
}
function localAnalyze(text,industry,playersSel,gameType){
  const n=playersSel==='4+'?4:+playersSel;const s=text.toLowerCase();
  let names=findNames(text).slice(0,n);
  const fill=['Incumbent','Challenger','Third player','Fourth player'];
  if(/\b(we|our|us)\b/.test(s)&&names.length<n)names.unshift('Us');
  for(let i=0;names.length<n;i++){const f=fill[i];if(!names.includes(f))names.push(f);}
  names=names.slice(0,n);
  const acts=movesFor(text);const agg=[1,.5,0];
  // per-player temperament from the sentences that mention them
  const sents=text.split(/(?<=[.!?])\s+/);
  const HOT=/aggress|undercut|drop|slash|chas|vc-backed|vc backed|funded|disrupt|higher pay|lower|steal|first to market|entering|new\b|startup|growth/gi;
  const CALM=/establish|reputation|premium|large|big|branch|strong|incumbent|loyal|years|national/gi;
  const pos=names.map(nm=>text.indexOf(nm));
  const temper=names.map((nm,i)=>{if(pos[i]<0)return {hot:0,calm:0};const nxt=pos.filter(p=>p>pos[i]);const end=nxt.length?Math.min(...nxt):pos[i]+200;
    const seg=text.slice(pos[i],end)+' '+sents.filter(x=>x.startsWith(nm)).join(' ');return {hot:Math.min(3,(seg.match(HOT)||[]).length),calm:Math.min(3,(seg.match(CALM)||[]).length)};});
  const heat=(s.match(/aggress|war\b|undercut|drop|slash|cut|vc-backed|vc backed|funded|disrupt|first to market|first-mover|lower|higher pay|steal/g)||[]).length;
  const T=1+Math.min(1.2,.22*heat);                 // temptation to escalate
  const war=.9;                                     // mutual damage when two or more escalate
  const coop={simultaneous:.25,sequential:.3,repeated:.85,cooperative:1.15}[gameType]||.3; // value of keeping the peace
  const G={seq:gameType==='sequential'&&n===2,players:names.map(nm=>({name:nm,acts})),
    payoff(p){const ag=p.map(a=>agg[a]);const nEsc=p.filter(a=>a===0).length;const calm=p.every(a=>a!==0);
      return p.map((a,i)=>{const others=ag.filter((_,j)=>j!==i);const m=others.reduce((x,y)=>x+y,0)/others.length;
        const tp=temper[i]||{hot:0,calm:0};let u=(T+.3*tp.hot-.2*tp.calm)*(ag[i]-m)-.55*ag[i]+.15*tp.calm*(1-ag[i]);if(nEsc>=2)u-=war*(.6+.4*ag[i]);if(calm)u+=coop*(1-ag[i]*.5);return u;});}};
  const x={lambda:gameType==='repeated'?7:6};
  const r=solve(G,x,{});const joint=r.joint;
  const cls=p=>{const e=p.filter(a=>a===0).length;if(e>=2)return 2;if(e===1)return 1;return 0;};
  const ob=[0,0,0];r.prof.forEach((p,k)=>{ob[cls(p)]+=joint[k];});
  const H=-joint.reduce((q,p)=>q+(p>0?p*Math.log(p):0),0),stab=1-H/Math.log(joint.length);
  const eu=r.EU[0];let rec=0;eu.forEach((v,i)=>{if(v>eu[rec])rec=i;});
  const eqType=r.seq?'Stackelberg':r.nash.length===1?'Unique pure Nash':r.nash.length>1?'Multiple equilibria':'Mixed strategy';
  const eqNote=r.seq?`Leader plays ${acts[r.nash[0][0]]}, follower answers ${acts[r.nash[0][1]]}`:r.nash.length===1?'Stable point: '+r.nash[0].map((a,i)=>`${names[i]} ${acts[a].toLowerCase()}`).join(' · '):r.nash.length>1?'Outcome depends on who blinks first':'No stable point; players keep second-guessing';
  const stability=stab>.45?'High':stab>.22?'Medium':'Low';
  const conflict=ob[2]>.35?'High':ob[2]>.15?'Medium':'Low';
  const players=names.map((nm,i)=>{const sg=r.sig[i];const t=sg.indexOf(Math.max(...sg));
    const why=t===0?`Escalating pays for ${nm} because the share it can win outweighs the margin it gives up, especially if rivals hold back.`:
      t===1?`${nm} does best by following: it protects its position without being the one that starts a costly fight.`:
      `${nm} gains more from keeping margin and positioning than from fighting for share it may not keep.`;
    return {name:nm,dominant_move:acts[t],reasoning:why,is_dominant:sg[t]>.6,odds:acts.map((a,k)=>({move:a,p:sg[k]}))};});
  const outcomes=[
    {label:gameType==='cooperative'?'Players cooperate and hold':'Uneasy truce: nobody escalates',probability:Math.round(ob[0]*100),color:'green'},
    {label:'One player breaks away',probability:Math.round(ob[1]*100),color:'blue'},
    {label:'Escalation: two or more escalate',probability:Math.round(ob[2]*100),color:'red'}];
  const fix=100-outcomes.reduce((a,o)=>a+o.probability,0);outcomes[outcomes.findIndex(o=>o.probability===Math.max(...outcomes.map(q=>q.probability)))].probability+=fix;
  const lead=outcomes.reduce((a,b)=>b.probability>a.probability?b:a);
  const gtext={simultaneous:'Everyone decides at the same time without seeing the others’ move',sequential:`${names[0]} moves first and ${names[1]||'the rival'} responds`,repeated:'The rivalry repeats, so today’s move shapes how rivals treat you next round',cooperative:'Players can form alliances, so keeping the peace has real value'}[gameType];
  const m0=acts[rec].toLowerCase();
  return {
    equilibrium_type:eqType,eq_note:eqNote,stability,conflict_risk:conflict,best_move:acts[rec],
    situation_title:`${names.slice(0,-1).join(', ')}${names.length>1?' and ':''}${names[names.length-1]}: who moves, and who wins?`,
    situation_analysis:`This is a ${n}-player ${gameType} game in ${industry}. ${gtext}. Each player can ${acts.map(a=>a.toLowerCase()).join(', or ')}. The pull to escalate is ${T>1.5?'strong':T>1.2?'moderate':'mild'} in this scenario, and a fight where two or more escalate hurts everyone involved.`,
    players,outcomes,
    recommendation_title:`${names[0]}: ${acts[rec]}`,
    recommendation:`Against the most likely rival moves, “${m0}” gives ${names[0]} the best expected result. ${rec===0?'Move decisively and early, but have a plan to stop before it turns into a war.':rec===1?'Signal that you will answer any escalation, but do not start one.':'Use the margin you keep to strengthen what makes you different, and watch for the first rival to break.'} The most likely outcome right now is “${lead.label.toLowerCase()}” at ${lead.probability}%.`,
    longterm_title:gameType==='repeated'||gameType==='cooperative'?'Patience is rewarded':'Watch for the first mover',
    longterm:gameType==='repeated'||gameType==='cooperative'?`Because the players meet again and again, a credible threat to respond keeps escalation in check. Expect stretches of calm broken by short price or feature fights when one player is under pressure.`:`One-shot games reward the player who commits first and credibly. Watch for public signals (announcements, funding, capacity) that show which player is about to move, and re-run the analysis when one lands.`
  };
}

async function runAnalyze(){
  const text=(document.getElementById('an-text').value||'').trim();
  A.text=text;A.players=document.getElementById('an-players').value;A.gameType=document.getElementById('an-game').value;
  if(text.length<30){A.error='Please describe the situation in a bit more detail (at least a sentence or two).';render();return;}
  A.error='';A.busy=true;render();
  let res=null,src='local';
  if(LIVE_API.on){
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),LIVE_API.timeoutMs);
      const r=await fetch(LIVE_API.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:text,industry:A.industry,players:A.players,gameType:A.gameType}),signal:ctl.signal});
      clearTimeout(to);const d=await r.json();if(d&&!d.error&&d.players&&d.outcomes){res=d;src='live';}
    }catch(_){}
  }
  if(!res){await new Promise(r=>setTimeout(r,450));res=localAnalyze(text,A.industry,A.players,A.gameType);}
  A.busy=false;A.result=res;A.source=src;render();
  requestAnimationFrame(()=>{const o=document.getElementById('an-out');if(o)o.scrollIntoView({behavior:'smooth',block:'start'});});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  const keep=()=>{const t=document.getElementById('an-text');if(t){A.text=t.value;A.players=document.getElementById('an-players').value;A.gameType=document.getElementById('an-game').value;}};
  if(a==='ind'){keep();A.industry=b.dataset.v;render();}
  else if(a==='ex'){const x=EXAMPLES[+b.dataset.i];Object.assign(A,{text:x.text,industry:x.industry,players:x.players,gameType:x.gameType,error:''});render();document.getElementById('an-text').focus();}
  else if(a==='analyze'){runAnalyze();}
  else if(a==='an-edit'){window.scrollTo({top:0,behavior:'smooth'});const t=document.getElementById('an-text');if(t)t.focus({preventScroll:true});}
  else if(a==='an-copy'){const d=A.result;if(!d)return;const t=`${d.situation_title}\n\nEquilibrium: ${d.equilibrium_type} · Stability: ${d.stability} · Conflict risk: ${d.conflict_risk}\n\n${d.situation_analysis}\n\nRecommendation: ${d.recommendation_title}\n${d.recommendation}\n\nOutcomes:\n${(d.outcomes||[]).map(o=>`- ${o.label}: ${o.probability}%`).join('\n')}`;
    try{navigator.clipboard.writeText(t).then(()=>toast('Summary copied')).catch(()=>toast('Copy not available here'));}catch(_){toast('Copy not available here');}}
});

/* ============ ROUTER ============ */
function render(){
  const r=(location.hash||'#analyze').slice(1);S.route=['analyze','room','setup','memo','screens'].includes(r)?r:'analyze';
  document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===S.route?'page':'false'));
  const m=document.getElementById('main');
  const body=S.route==='analyze'?analyzeHTML():S.route==='room'?roomHTML(S.game):S.route==='setup'?setupHTML(S.setupBook):S.route==='memo'?memoHTML(S.game):screensHTML();
  m.innerHTML=`<div class="view"><div class="wrap app">${body}</div></div>`;
  if(S.route==='screens')requestAnimationFrame(()=>{fitFrames();setTimeout(fitFrames,400);});
}
addEventListener('hashchange',()=>{render();window.scrollTo({top:0});});
addEventListener('resize',()=>{if(S.route==='screens')fitFrames();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.route==='screens')fitFrames();});
render();
</script>
</body></html>
